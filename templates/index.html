<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Фотогалерея</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; }
        form { margin-bottom: 24px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
        .card { border: 1px solid #ddd; border-radius: 6px; overflow: hidden; }
        .card img { width: 100%; height: 150px; object-fit: cover; display: block; }
        .card .caption { padding: 8px; font-size: 0.9em; }
    </style>
</head>
<body>
    <h1>Фотогалерея</h1>

    <form action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data">
        <input type="file" name="photo" accept="image/*" required>
        <input type="text" name="caption" placeholder="Подпись к фото">
        <button type="submit">Загрузить</button>
    </form>

    {% if photos %}
    <div class="grid">
        {% for photo in photos %}
        <div class="card">
            <img src="{{ url_for('uploaded_file', filename=photo.filename) }}" alt="{{ photo.caption }}">
            <div class="caption">{{ photo.caption or '(без подписи)' }}</div>
        </div>
        {% endfor %}
    </div>
    {% else %}
        <p>Пока нет ни одной фотографии. Загрузите первую!</p>
    {% endif %}
</body>
</html>
